# CI for the Rust port and the JS game's unit tests (roadmap WP 0.2).
# No deploy: GitHub Pages serves main as it is (the JS game) until cutover
# (roadmap M9). The browser suites need a GPU and run on the dev machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (format, clippy, tests, dependency rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The Bevy client links libwayland-client natively (DECISIONS D100).
      - name: System libraries for the native client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p mr_game --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask check-deps

  wasm:
    name: Wasm (tests under Node, kernel bits, web build, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: wasm-opt (binaryen 116)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_116/bin" >> "$GITHUB_PATH"
      - name: Simulation crates' tests in wasm (Node)
        run: cargo test --target wasm32-unknown-unknown -p mr_math -p mr_track -p mr_levels -p mr_sim
      - name: World generation's tests in wasm (Node)
        run: cargo test --target wasm32-unknown-unknown -p mr_worldgen
      - name: Kernel in wasm is bit-identical to native
        run: cargo xtask kernel --check
      - run: cargo xtask web --release
      - run: cargo xtask size --budget

  js:
    name: JS unit tests (kernel off and on), module traces
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Unit tests with the parity kernel
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs npm run test:unit
      - name: Module traces reproduce the committed goldens
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/sim-module.mjs --check
      - name: The math golden reproduces
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/math-golden.mjs --check
      - name: The Seaside survey golden reproduces
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/seaside-golden.mjs --check
      - name: The three.js geometry golden reproduces
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/three-geom.mjs --check
      - name: The builders golden reproduces
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/builders.mjs --check
      - name: The terrain plan golden reproduces
        run: NODE_OPTIONS=--import=./tools/parity/kernel/register.mjs node tools/parity/terrain-plan.mjs --check
