# Midnight Playground, the Rust port of Midnight Racer. The plan is docs/rust-port/SPEC.md and ROADMAP.md;
# the dependency rules between these crates (SPEC 3.2) are enforced by
# `cargo xtask check-deps`. The JS game at the repo root is untouched by this.
[workspace]
resolver = "3"
members = ["crates/*", "xtask", "tools/parity/kernel"]
default-members = ["crates/*"]
# Patched dependencies (below), not ours to build, lint or format.
exclude = ["patches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/sequoia-hope/midnight-racer"

[workspace.dependencies]
mp_math = { path = "crates/mp_math" }
mp_track = { path = "crates/mp_track" }
mp_levels = { path = "crates/mp_levels" }
mp_sim = { path = "crates/mp_sim" }
mp_scene = { path = "crates/mp_scene" }
mp_canvas = { path = "crates/mp_canvas" }
mp_worldgen = { path = "crates/mp_worldgen" }
mp_audio = { path = "crates/mp_audio" }
mp_exhaust = { path = "crates/mp_exhaust" }
mp_music = { path = "crates/mp_music" }
mp_net = { path = "crates/mp_net" }
mp_vdyn = { path = "crates/mp_vdyn" }
mp_atlas = { path = "crates/mp_atlas" }
# The CLI that post-processes the wasm must be this exact version;
# `cargo xtask web` checks it.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = "0.3"

# Dev builds: our code fast to compile, dependencies optimised (SPEC 11).
[profile.dev.package."*"]
opt-level = 3

# Release web builds (SPEC 11): `cargo xtask web --release`, then wasm-opt.
[profile.web-release]
inherits = "release"
# Size over speed: about 1.3 MB less wasm after gzip for 0.1 to 0.2 ms more
# per CPU-bound frame, pictures identical (D675).
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# The exhaust model runs per sample on the audio thread: a dev build of the
# native game must keep up in real time.
[profile.dev.package.mp_exhaust]
opt-level = 3

# The same on the web, where it is its own wasm in the AudioWorklet
# (`cargo xtask web --release`): speed over size there.
[profile.web-release.package.mp_exhaust]
opt-level = 3

# The radio's station player (the Music Lab's port) runs per sample on the
# audio thread too: natively in a dev build, on the web as its own wasm.
[profile.dev.package.mp_music]
opt-level = 3

[profile.web-release.package.mp_music]
opt-level = 3

# xtask's image metrics run over hundreds of screenshots.
[profile.dev.package.xtask]
opt-level = 3

# wgpu with the WebGPU device's limits and features read once (DECISIONS
# D1182; patches/wgpu/PATCHED.md). Bevy asks for the limits on every draw.
[patch.crates-io]
wgpu = { path = "patches/wgpu" }
