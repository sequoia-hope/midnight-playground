[package]
name = "mp_audio"
description = "Web Audio shaped facade and backends; engine, SFX, music, radio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mp_math.workspace = true
# Array hashes: the audio reference names arrays by SHA-256 (the null
# backend's call log, the parity tests).
sha2 = "0.10"
# The radio's clip index (`audio/radio/index.json`).
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { workspace = true, optional = true, features = [
    "console",
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextLatencyCategory",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "ChannelMergerNode",
    "ConvolverNode",
    "DelayNode",
    "DynamicsCompressorNode",
    "GainNode",
    "OfflineAudioContext",
    "OscillatorNode",
    "OscillatorType",
    "OverSampleType",
    "PeriodicWave",
    "PeriodicWaveConstraints",
    "Response",
    "StereoPannerNode",
    "WaveShaperNode",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native backend (SPEC 7.1): a Rust implementation of Web Audio. No
# output device by default (offline rendering and the "none" sink); the
# `native-device` feature adds cpal.
web-audio-api = { version = "=1.7.0", optional = true, default-features = false, features = ["mp3"] }

[features]
default = ["null"]
# Backends (SPEC 7.1): the browser's Web Audio, the web-audio-api crate, or a
# recorder for headless runs and strict tests.
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures"]
native = ["dep:web-audio-api"]
native-device = ["native", "web-audio-api/cpal"]
null = []

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
# The radio test (`test/unit/radio.test.js`) reads the levels' zones and
# rivals and the pursuit's callsigns. Test-only: the library itself stays on
# mp_math (SPEC 3.2).
mp_track.workspace = true
mp_levels.workspace = true
mp_sim.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The drive logs are gzipped (parity/golden/audio/drive-*.jsonl.gz).
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "render_scenarios"
required-features = ["native"]
