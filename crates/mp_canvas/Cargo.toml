[package]
name = "mp_canvas"
description = "The Canvas 2D subset the texture generators use"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mp_math.workspace = true
# Pixmap, path building and the stroker. Coverage and compositing are
# mp_canvas's own (DECISIONS D151).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
# Text: HarfBuzz's shaping in Rust (GPOS kerning and ligatures, with
# variable-font deltas) and skrifa's outlines and metrics, both on
# read-fonts 0.43 (DECISIONS D152).
harfrust = "0.13.3"
skrifa = "0.46.0"

[dev-dependencies]
png = "0.18"
serde_json = "1"

[[example]]
name = "font-gallery"
path = "examples/font_gallery.rs"
