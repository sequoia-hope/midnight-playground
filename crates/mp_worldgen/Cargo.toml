[package]
name = "mp_worldgen"
description = "World generation: terrain, road, sky, sea, scenery, car models, textures"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mp_scene.workspace = true
mp_canvas.workspace = true
mp_math.workspace = true
mp_track.workspace = true
mp_levels.workspace = true
# Material parameters are JSON values in the scene (mp_scene::MaterialDesc),
# in the JS order.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
# The goldens (JSON numbers parsed exactly, D55) and the texture gate's
# cached PNGs (tests/textures.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
sha2 = "0.10"
# The car models' dimensions are checked against the simulation's table
# (tests/car_model.rs; DECISIONS D412). A dev-dependency only: mp_worldgen
# itself does not depend on mp_sim (SPEC 3.2).
mp_sim.workspace = true

[features]
# Native only: run the pieces of a parallel build job on threads (SPEC 5.5;
# std's scoped threads, DECISIONS D196). Ignored on wasm.
parallel = []

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
