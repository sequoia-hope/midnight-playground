[package]
name = "mp_sim"
description = "The Midnight Playground simulation: vehicles, physics, AI, traffic, collisions, race rules, pursuit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mp_math.workspace = true
mp_track.workspace = true
mp_levels.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The command-line runner reads files and the clock, so it sits outside
# src/, which the simulation rules cover (DECISIONS D62).
[[bin]]
name = "mp-sim"
path = "bin/mp-sim.rs"
