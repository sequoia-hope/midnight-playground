[package]
name = "mr_sim"
description = "The Midnight Racer simulation: vehicles, physics, AI, traffic, collisions, race rules, pursuit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mr_math.workspace = true
mr_track.workspace = true
mr_levels.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The command-line runner reads files and the clock, so it sits outside
# src/, which the simulation rules cover (DECISIONS D62).
[[bin]]
name = "mr-sim"
path = "bin/mr-sim.rs"
