[package]
name = "mp_net"
description = "Multiplayer protocol, transports, session, prediction and rollback"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The WebRTC transport (`rtc`, DECISIONS D1120): matchbox with webrtc-rs
# natively, the page's RTCPeerConnection in the browser. Off by default so
# the session's tests and the soak don't build webrtc-rs; `mp_host` and
# `mp_game` turn it on.
rtc = [
    "dep:matchbox_socket",
    "dep:matchbox_protocol",
    "dep:serde_json",
    "dep:futures",
    "dep:futures-timer",
    "dep:async-tungstenite",
    "dep:getrandom",
    "dep:ws_stream_wasm",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
mp_math.workspace = true
mp_levels.workspace = true
mp_sim.workspace = true
# The sealed signalling (`signal`, DECISIONS D1122): pure Rust, and
# without their `getrandom` features (the caller brings the randomness).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
matchbox_socket = { version = "=0.14.0", optional = true }
matchbox_protocol = { version = "0.14", optional = true }
serde_json = { version = "1", optional = true }
futures = { version = "0.3", optional = true, default-features = false, features = ["std", "executor"] }
futures-timer = { version = "3", optional = true }

# The signalling WebSocket, as matchbox's own natively (no new crates).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-tungstenite = { version = "0.32", optional = true, default-features = false, features = ["async-std-runtime", "async-tls", "futures-03-sink"] }
getrandom = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ws_stream_wasm = { version = "0.7", optional = true, default-features = false }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Crypto"] }
