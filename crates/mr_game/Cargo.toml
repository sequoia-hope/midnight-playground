[package]
name = "mr_game"
description = "The Midnight Racer client: states, rendering, camera, effects, HUD, menus, input, platform glue"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The web build is the cdylib, post-processed by wasm-bindgen into dist/next/
# (`cargo xtask web`). The native build is the binary.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "midnight-racer"
path = "src/main.rs"

[dependencies]
mr_sim.workspace = true
mr_net.workspace = true
mr_scene.workspace = true
mr_worldgen.workspace = true
mr_audio.workspace = true
mr_track.workspace = true
mr_levels.workspace = true
mr_math.workspace = true
# The material test scenes' definitions (parity/golden/materials/scenes.json)
# and the scene export's material parameters.
serde_json = "1"
# Bevy 0.19.1, pinned (SPEC 2's version policy; DECISIONS D100). Default
# features off: the 3D renderer, windowing, states and input only. No UI,
# text, audio, glTF, gizmos or picking yet; the packages that need them add
# them. The platform-specific features are in the target tables below.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_material",
    "bevy_shader",
    "bevy_post_process",
    "keyboard",
    "mouse",
    "touch",
    # PNG encoding for screenshots (native --screenshot, the web test hook).
    "png",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "multi_threaded",
    "x11",
    "wayland",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU only; the WebGL2 build is roadmap WP 2.7.
bevy = { version = "=0.19.1", default-features = false, features = ["web", "webgpu"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "Navigator", "Location", "Performance"] }
