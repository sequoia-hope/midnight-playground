[package]
name = "mr_levels"
description = "The six Midnight Racer levels as data, and Seaside's survey data loader"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mr_math.workspace = true
mr_track.workspace = true
miniz_oxide = "0.9"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
