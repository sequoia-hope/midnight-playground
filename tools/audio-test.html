<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Bench</title>
<link rel="icon" href="data:,">
<style>
:root { --bg: #0d0f14; --card: #161a22; --line: #262c36; --fg: #e6e9ee; --muted: #8b94a3; --accent: #ff3d7f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 16px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); max-width: 1100px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
label { display: grid; grid-template-columns: 90px 1fr 56px; align-items: center; gap: 8px; margin: 4px 0; }
label span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
input[type=range] { width: 100%; }
button { background: #222834; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin: 3px 3px 3px 0; cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.chk { display: flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; }
#state { color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<h1>Midnight Racer — audio bench</h1>
<p>Auditions every sound in <code>src/game/Audio.js</code> and the soundtrack in <code>src/game/audio/</code>. Everything is synthesized; press Start first.</p>
<div class="row" style="margin-bottom:12px">
  <button class="primary" id="start">Start audio</button>
  <button id="auto">Auto-drive demo: off</button>
  <span id="state">not started</span>
</div>
<div class="grid">
  <section class="card">
    <h2>Engine</h2>
    <div class="row" style="margin-bottom:6px">
      <span>Car</span>
      <button data-car="sports" class="car">Sports (flat-plane V8)</button>
      <button data-car="muscle" class="car">Muscle (cross-plane V8)</button>
      <button data-car="super" class="car">Super (V10)</button>
      <button data-car="rally" class="car">Rally (turbo four)</button>
      <button data-car="electric" class="car">Electric (motor)</button>
    </div>
    <label>RPM <input id="rpm" type="range" min="800" max="7800" value="900"><span></span></label>
    <label>Throttle <input id="throttle" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <label>Speed m/s <input id="speed" type="range" min="0" max="90" value="0"><span></span></label>
    <label>Gear <input id="gear" type="range" min="-1" max="6" value="1"><span></span></label>
    <label>Turbo boost <input id="boost" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <label>EV power kW <input id="power" type="range" min="-250" max="1000" value="0"><span></span></label>
    <label>EV regen <input id="regen" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <div class="row">
      <button id="shiftUp">Shift up</button><button id="shiftDown">Shift down</button>
    </div>
  </section>
  <section class="card">
    <h2>Surface</h2>
    <label>Skid <input id="skid" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <label>Slip rad <input id="slip" type="range" min="0" max="0.9" step="0.01" value="0.2"><span></span></label>
    <label>Scrape <input id="scrape" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <label>Scrape side <input id="scrapeSide" type="range" min="-1" max="1" step="2" value="1"><span></span></label>
    <label>Off-road <input id="offroad" type="range" min="0" max="1" step="0.01" value="0"><span></span></label>
    <div class="row">
      <span class="chk"><input id="nitro" type="checkbox"> Nitro held</span>
      <span class="chk"><input id="onGround" type="checkbox" checked> On ground</span>
    </div>
    <div class="row"><button id="nitroBurst">Nitro burst</button></div>
  </section>
  <section class="card">
    <h2>One-shots</h2>
    <label>Strength <input id="strength" type="range" min="0" max="1" step="0.01" value="0.6"><span></span></label>
    <div class="row">
      <button id="impact">Impact</button><button id="landing">Landing</button>
      <button id="whooshL">Whoosh L</button><button id="whooshR">Whoosh R</button>
    </div>
    <div class="row">
      <button id="beep">Beep</button><button id="go">GO beep</button><button id="countdown">3-2-1-GO</button>
      <button id="fanfare">Finish fanfare</button>
    </div>
    <div class="row">
      <button id="uiClick">UI click</button><button id="uiStart">UI start</button>
    </div>
  </section>
  <section class="card">
    <h2>Rivals</h2>
    <label>Distance m <input id="rdist" type="range" min="0" max="100" value="20"><span></span></label>
    <label>Pan <input id="rpan" type="range" min="-1" max="1" step="0.05" value="0.4"><span></span></label>
    <label>RPM norm <input id="rrpm" type="range" min="0" max="1" step="0.01" value="0.6"><span></span></label>
    <span class="chk"><input id="rivalsOn" type="checkbox"> Rival engines on (3 cars)</span>
  </section>
  <section class="card">
    <h2>Mix</h2>
    <label>Master <input id="vMaster" type="range" min="0" max="1" step="0.01" value="1"><span></span></label>
    <label>SFX <input id="vSfx" type="range" min="0" max="1" step="0.01" value="0.85"><span></span></label>
    <label>Music <input id="vMusic" type="range" min="0" max="1" step="0.01" value="0.7"><span></span></label>
    <div class="row">
      <button id="music">Music: off</button><button id="pause">Pause: off</button>
      <button id="env">Environment: open</button>
    </div>
  </section>
  <section class="card">
    <h2>Music</h2>
    <div class="row" style="margin-bottom:6px"><select id="track"></select><button id="playTrack">Play</button><button id="nextTrack">Next ⏭</button></div>
    <label>Start bar <input id="bar" type="range" min="0" max="120" value="0"><span></span></label>
    <div class="row"><span id="np" style="color:var(--muted)">—</span></div>
    <div class="row"><button id="renderWav">Render WAV (offline)</button><span id="renderState" style="color:var(--muted)"></span></div>
  </section>
</div>
<script type="module">
import { GameAudio } from '../src/game/Audio.js';

// Offline render of a track through the game's real music bus (a whole
// GameAudio on an OfflineAudioContext, SFX silent), faster than real time.
// Returns a 16-bit WAV plus loudness: overall RMS, peak, and RMS per 5 s.
async function renderTrack(id, { secs = 60, bar = 0, rate = 44100, solo = null, wav: wantWav = true } = {}) {
  const oc = new OfflineAudioContext(2, Math.ceil(secs * rate), rate);
  const a = new GameAudio();
  await a.init({ context: oc });
  a.setVolume({ master: 1, sfx: 0, music: 0.7 });
  a.music.solo = solo;
  a.music.play(id, { bar });
  a.setMusic(true);
  a.music.pumpUntil(1);
  for (let t = 0.5; t < secs; t += 0.5) oc.suspend(t).then(() => { a.music.pumpUntil(t + 1); oc.resume(); });
  const buf = await oc.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
  let sum = 0, peak = 0, wsum = 0, wn = 0; const per = [];
  const win = rate * 5;
  for (let i = 0; i < n; i++) {
    const e = (L[i] * L[i] + R[i] * R[i]) / 2;
    sum += e; wsum += e; wn++;
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    if (wn === win) { per.push(+(10 * Math.log10(wsum / wn + 1e-12)).toFixed(1)); wsum = wn = 0; }
  }
  const stats = { rmsDb: +(10 * Math.log10(sum / n + 1e-12)).toFixed(1), peak: +peak.toFixed(3), per5s: per };
  if (!wantWav) return stats;
  const wav = new ArrayBuffer(44 + n * 4), v = new DataView(wav);
  const str = (o, x) => { for (let i = 0; i < x.length; i++) v.setUint8(o + i, x.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    v.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    v.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true);
  }
  return { wav, ...stats };
}
const audio = new GameAudio();
window.audio = audio;
const $ = (id) => document.getElementById(id);
const num = (id) => Number($(id).value);
for (const el of document.querySelectorAll('input[type=range]')) {
  const out = el.nextElementSibling;
  const show = () => { out.textContent = el.value; };
  el.addEventListener('input', show); show();
}
$('start').onclick = async () => { await audio.init(); $('state').textContent = audio.ready ? 'running (' + audio.ctx.sampleRate + ' Hz)' : 'WebAudio unavailable'; };
$('shiftUp').onclick = () => audio.shift(true);
$('shiftDown').onclick = () => audio.shift(false);
$('nitroBurst').onclick = () => audio.nitroBurst();
$('impact').onclick = () => audio.impact(num('strength'));
$('landing').onclick = () => audio.landing(num('strength'));
$('whooshL').onclick = () => audio.whoosh(-0.8, num('strength'));
$('whooshR').onclick = () => audio.whoosh(0.8, num('strength'));
$('beep').onclick = () => audio.beep(false);
$('go').onclick = () => audio.beep(true);
$('countdown').onclick = () => { [0, 1000, 2000].forEach((d) => setTimeout(() => audio.beep(false), d)); setTimeout(() => audio.beep(true), 3000); };
$('fanfare').onclick = () => audio.finishFanfare();
$('uiClick').onclick = () => audio.uiClick('click');
$('uiStart').onclick = () => audio.uiClick('start');
for (const t of GameAudio.tracks) $('track').add(new Option(`${t.title} — ${t.style} (${t.bpm} BPM)`, t.id));
audio.onTrackChange = (info) => { $('np').textContent = '♪ ' + info.title + ' · ' + info.style; };
$('playTrack').onclick = () => {
  if (!audio.ready) return;
  const bar = num('bar');
  if (bar) audio.music.play($('track').value, { bar }); else audio.playTrack($('track').value);
  if (!musicOn) $('music').click();
};
$('nextTrack').onclick = () => { const i = audio.nextTrack(); if (i) $('np').textContent = '♪ ' + i.title + ' · ' + i.style; };
window.renderTrack = renderTrack;
$('renderWav').onclick = async () => {
  $('renderState').textContent = 'rendering…';
  const r = await renderTrack($('track').value, { secs: 60, bar: num('bar') });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([r.wav], { type: 'audio/wav' })), download: $('track').value + '.wav' });
  a.click();
  $('renderState').textContent = `RMS ${r.rmsDb} dB, peak ${r.peak}`;
};
let musicOn = false, paused = false, auto = false;
$('music').onclick = () => { musicOn = !musicOn; audio.setMusic(musicOn); $('music').textContent = 'Music: ' + (musicOn ? 'on' : 'off'); };
$('pause').onclick = () => { paused = !paused; audio.setPaused(paused); $('pause').textContent = 'Pause: ' + (paused ? 'on' : 'off'); };
$('env').onclick = () => { const next = audio.environment === 'tunnel' ? 'open' : 'tunnel'; audio.setEnvironment(next); $('env').textContent = 'Environment: ' + next; };
const markCar = () => { for (const b of document.querySelectorAll('.car')) b.classList.toggle('primary', b.dataset.car === audio.car); };
for (const b of document.querySelectorAll('.car')) b.onclick = () => { audio.setCar(b.dataset.car); markCar(); };
markCar();
$('auto').onclick = () => { auto = !auto; $('auto').textContent = 'Auto-drive demo: ' + (auto ? 'on' : 'off'); };
for (const [id, key] of [['vMaster', 'master'], ['vSfx', 'sfx'], ['vMusic', 'music']]) {
  $(id).addEventListener('input', () => audio.setVolume({ [key]: num(id) }));
}

// Auto-drive: accelerate through the gears, lift, brake, repeat.
const ratios = [3.2, 2.2, 1.6, 1.25, 1.0, 0.82];
const sim = { v: 0, gear: 1, t: 0 };
function autoStep(dt) {
  sim.t += dt;
  const phase = sim.t % 16;
  const thr = phase < 11 ? 1 : 0;
  const brake = phase > 12.5;
  sim.v += (thr * 9 / (1 + sim.gear * 0.35) - (brake ? 14 : 0.8) - sim.v * sim.v * 0.0008) * dt;
  sim.v = Math.max(0, sim.v);
  let rpm = 900 + sim.v * ratios[sim.gear - 1] * 32;
  if (rpm > 7400 && sim.gear < 6) { sim.gear++; audio.shift(true); }
  if (rpm < 3000 && sim.gear > 1 && !thr) { sim.gear--; audio.shift(false); }
  rpm = Math.min(7800, 900 + sim.v * ratios[sim.gear - 1] * 32);
  $('rpm').value = rpm; $('throttle').value = thr; $('speed').value = sim.v; $('gear').value = sim.gear;
  $('skid').value = brake && sim.v > 10 ? 0.6 : 0;
  for (const id of ['rpm', 'throttle', 'speed', 'gear', 'skid']) $(id).dispatchEvent(new Event('input'));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(frame);
  if (window.externalDrive) return; // a test harness is driving update() itself
  if (auto) autoStep(dt);
  // The electric car's motor follows road speed (single gear, limiter at CAR_SPECS.electric.vmax).
  const ev = audio.car === 'electric';
  audio.update(dt, {
    rpm: num('rpm'), rpmMax: 7800, throttle: num('throttle'), gear: num('gear'), speed: num('speed'),
    skid: num('skid'), nitro: $('nitro').checked, onGround: $('onGround').checked, scrape: num('scrape'),
    slip: num('slip'), offroad: num('offroad'), scrapeSide: num('scrapeSide'),
    boost: num('boost'),
    ...(ev ? { motor: num('speed') / 71, power: num('power'), regen: num('regen') } : {}),
  });
  if ($('rivalsOn').checked) {
    const d = num('rdist'), p = num('rpan'), r = num('rrpm');
    audio.setRivalEngines([{ dist: d, pan: p, rpmNorm: r }, { dist: d + 15, pan: -p, rpmNorm: r * 0.9 }, { dist: d + 30, pan: 0, rpmNorm: r * 1.1 }]);
  } else audio.setRivalEngines([]);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
